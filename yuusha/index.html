<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ランダム勇者</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0d1e;--win:#101633;--line:#f2f2f2;--gold:#ffd84a;--red:#ff5a5a;--green:#6dff8a;--blue:#7fc8ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:#fff;font-family:'DotGothic16',monospace}
body{min-height:100vh;display:flex;justify-content:center;background-image:radial-gradient(#1b2150 1px,transparent 1px);background-size:8px 8px}
#app{width:100%;max-width:480px;padding:10px;display:flex;flex-direction:column;gap:10px}
.win{background:var(--win);border:3px solid var(--line);border-radius:6px;box-shadow:0 0 0 3px #000,inset 0 0 0 2px #000;padding:8px 10px}
.head{display:flex;align-items:center;justify-content:center;gap:8px;position:relative}
h1{font-size:19px;text-align:center;margin:2px 0;color:var(--gold);text-shadow:2px 2px 0 #7a3b00;letter-spacing:1px;font-weight:normal}
#mute{position:absolute;right:0;top:-2px;font-size:14px;padding:4px 7px;border-width:2px;box-shadow:0 2px 0 #000}
canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
.hero-top{display:flex;gap:10px;align-items:center}
.hero-top .info{flex:1}
.name{font-size:15px;display:flex;justify-content:space-between}
.hpbar{height:10px;border:2px solid #fff;background:#300;margin-top:3px;position:relative}
.hpbar i{position:absolute;left:0;top:0;bottom:0;background:var(--green);transition:width .35s}
.hpbar i.low{background:var(--red)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:1px 14px;font-size:13px;margin-top:6px}
.stats div{display:flex;justify-content:space-between}
.stats .v{color:var(--gold)}
.plus{color:var(--green);font-size:11px;margin-left:3px}
.sub{font-size:12px;color:#b9c3ff;margin-top:5px;line-height:1.5}
#allies{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
#allies .al{display:flex;align-items:center;gap:2px;font-size:11px;color:#ffe9a8;width:100%}
#stage{position:relative;min-height:270px;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;text-align:center}
#stage.king{background:#2a0610}
.center{display:flex;flex-direction:column;align-items:center;gap:8px}
.note{font-size:13px;color:#cfd6ff;line-height:1.6}
.deck{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;max-width:420px}
.mc{width:22px;height:30px;border:2px solid #fff;border-radius:3px;font-size:11px;display:flex;align-items:center;justify-content:center;background:#3a1a6b}
.mc.done{background:#333;color:#999;border-color:#777}
.mc.cur{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
.mc.king{background:#7a0c1a;color:#fff}
.mc.w{background:#3b1a5c;color:#d9b3ff;border-color:#b46bff}
.card{width:120px;height:168px;perspective:600px}
.card .in{position:relative;width:100%;height:100%;transition:transform .7s;transform-style:preserve-3d}
.card.flipped .in{transform:rotateY(180deg)}
.card .f,.card .b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:3px solid #fff;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-direction:column;box-shadow:0 0 0 3px #000}
.card .b{background:repeating-linear-gradient(45deg,#3a1a6b 0 8px,#2a1050 8px 16px);font-size:40px;color:var(--gold);text-shadow:3px 3px 0 #000;transition:box-shadow .4s}
.card .f{background:#1a0d0d;transform:rotateY(180deg)}
.card.kingcard .b{background:repeating-linear-gradient(45deg,#6b0c1a 0 8px,#45040e 8px 16px)}
.card.sage .b{box-shadow:0 0 0 3px #000,0 0 34px 14px #ffd84a;border-color:var(--gold)}
@keyframes tremble{0%,100%{transform:rotate(0) translateX(0)}25%{transform:rotate(-2deg) translateX(-2px)}75%{transform:rotate(2deg) translateX(2px)}}
.tremble{animation:tremble .08s 5}
.card.sage{animation:tremble .07s infinite}
.ename{font-size:16px;color:#fff}
.ename.k{color:var(--red)}
.ebox{width:84%}
.estats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px 6px;font-size:11px;color:#cfd6ff;margin-top:4px;width:100%}
.estats span b{color:#fff;font-weight:normal}
@keyframes ghost{50%{opacity:.45;transform:translateX(2px)}}
.ghostly{animation:ghost 1.1s infinite}
#msg{min-height:122px;font-size:15px;line-height:1.55;position:relative}
#msg p{margin:0}
#msg p.dmg{color:#ffb3b3}
#msg p.good{color:var(--green)}
#msg p.gold{color:var(--gold)}
#msg p.purple{color:#d9b3ff}
#speed{position:absolute;right:6px;bottom:6px;font-size:11px;padding:3px 6px;box-shadow:none;border-width:2px}
#controls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;min-height:56px}
#controls.one{grid-template-columns:1fr}
#controls.two{grid-template-columns:1fr 1fr}
button{font-family:inherit;font-size:17px;color:#fff;background:#1d2a66;border:3px solid #fff;border-radius:4px;padding:11px 6px;box-shadow:0 4px 0 #000;cursor:pointer}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #000}
button.red{background:#7a1f1f}
button small{display:block;font-size:10px;color:#cfd6ff;margin-top:2px}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.shake{animation:shake .12s 3}
@keyframes quake{0%,100%{transform:translate(0,0)}20%{transform:translate(-6px,3px)}40%{transform:translate(5px,-4px)}60%{transform:translate(-4px,-2px)}80%{transform:translate(4px,4px)}}
.quake{animation:quake .1s 8}
@keyframes blink{50%{opacity:0}}
.blink{animation:blink .1s 4}
@keyframes flash{0%{background:#a00}100%{background:var(--win)}}
.flash{animation:flash .35s}
@keyframes healfx{0%{background:#0a5a2a}100%{background:var(--win)}}
.healfx{animation:healfx .6s}
@keyframes pop{0%{transform:translate(-50%,0);opacity:1}100%{transform:translate(-50%,-46px);opacity:0}}
.pop{position:absolute;left:50%;top:40%;font-size:24px;color:#fff;text-shadow:2px 2px 0 #000,-2px -2px 0 #000;animation:pop 1s forwards;pointer-events:none;white-space:nowrap;z-index:3}
.pop.crit{color:var(--gold);font-size:28px}
.pop.mag{color:#c9a6ff}
.itemget{position:absolute;inset:0;background:rgba(0,0,0,.78);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:15px;color:var(--gold);z-index:4}
.itemget.sage{background:radial-gradient(circle,rgba(255,216,74,.45),rgba(0,0,0,.85) 70%);font-size:20px}
@keyframes glow{from{filter:drop-shadow(0 0 4px #ffd84a)}to{filter:drop-shadow(0 0 18px #fff6b0)}}
.itemget.sage canvas{animation:glow .4s infinite alternate}
.big{font-size:30px;color:var(--gold);text-shadow:3px 3px 0 #7a3b00}
.dead canvas{filter:grayscale(1) brightness(.6)}
body::after{content:'';position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .6s}
body.tense::after{opacity:1;box-shadow:inset 0 0 95px 26px var(--tc,rgba(255,0,0,.55));animation:pulse .43s infinite alternate}
@keyframes pulse{from{filter:brightness(.6)}to{filter:brightness(1.3)}}
.warn{position:absolute;top:6px;left:0;right:0;color:var(--red);font-size:20px;letter-spacing:4px;text-shadow:2px 2px 0 #000;animation:blink .5s infinite;z-index:2}
#dim{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .5s;z-index:9}
#bolt{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:10}
#msg p.gray{color:#b8b8b8}
.party{display:flex;gap:10px;align-items:flex-end;justify-content:center}
@keyframes auraP{from{filter:drop-shadow(0 0 2px var(--ac))}to{filter:drop-shadow(0 0 9px var(--ac))}}
.aura-doom{--ac:#ff2020;animation:auraP .6s infinite alternate}
.aura-goddess{--ac:#fff2a0;animation:auraP 1.2s infinite alternate}
.aura-lucky{--ac:#7dff6a;animation:auraP .9s infinite alternate}
.dex{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;width:100%}
.dexcell{display:flex;flex-direction:column;align-items:center;font-size:9px;padding:3px 0;border:2px solid #3a4280;border-radius:4px;background:#0c1028;cursor:pointer;line-height:1.2}
.dexcell.rare{border-color:#7a5a10}
.dexcell.unk div{color:#666}
.recs{width:100%;max-height:360px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;text-align:left}
.rec{border:2px solid #fff;border-radius:4px;padding:5px 7px;background:#0c1028;font-size:12px}
.rh{display:flex;justify-content:space-between;color:var(--gold)}
.rs{display:grid;grid-template-columns:repeat(3,1fr);gap:0 8px;margin:3px 0}
.rs b{color:#fff;font-weight:normal}
.rf{color:#b9c3ff;font-size:11px}
.pickrow{display:flex;gap:10px;justify-content:center;align-items:flex-end;touch-action:none;user-select:none;-webkit-user-select:none}
.pcard{width:92px;height:132px;perspective:520px;touch-action:none;cursor:grab}
.pcard .in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.pcard.dragging .in{transition:none}
.pcard .f,.pcard .b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:3px solid #fff;border-radius:7px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;box-shadow:0 0 0 3px #000;font-size:12px}
.pcard .b{background:repeating-linear-gradient(45deg,#3a1a6b 0 8px,#2a1050 8px 16px)}
.pcard .b span{font-size:16px;color:var(--gold);text-shadow:2px 2px 0 #000}
.pcard .f{background:#1a1230;transform:rotateX(180deg);padding:4px;line-height:1.3}
.pcard .f .v{color:var(--green);font-size:11px}
.pcard.other{opacity:.45;transform:scale(.92);transition:opacity .4s,transform .4s}
.pcard.glow .b{box-shadow:0 0 0 3px #000,0 0 30px 12px #ffd84a;border-color:var(--gold)}
.pcard.glow{animation:tremble .07s infinite}
.pickhint{font-size:12px;color:#cfd6ff;margin-top:10px}
.pcard .b{overflow:hidden}
.pcard.rare .b{box-shadow:0 0 0 3px #000,0 0 16px 5px rgba(255,216,74,.65);border-color:#fff6b0}
.spark{position:absolute;color:#fff6b0;font-size:13px;font-style:normal;text-shadow:0 0 6px #ffd84a,0 0 10px #fff;animation:twinkle 1.1s infinite;pointer-events:none}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(.2) rotate(0)}50%{opacity:1;transform:scale(1.25) rotate(45deg)}}
.strike{position:absolute;left:0;top:0;pointer-events:none;z-index:6;filter:drop-shadow(0 0 8px #fff6b0)}
/* 絶望の演出（創造神） */
body.despair{background:#000}
body.despair #heroPanel,body.despair #msg,body.despair #controls{filter:grayscale(1) brightness(.75);transition:filter 2s}
body.despair #stage{background:#000 !important}
body.despair h1{color:#777;text-shadow:none;transition:color 2s}
body.despair.tense::after{animation:pulse 2.4s infinite alternate}
@keyframes ash{from{transform:translateY(-10px);opacity:0}20%{opacity:.8}to{transform:translateY(300px);opacity:0}}
.ash{position:absolute;top:0;width:3px;height:3px;background:#999;animation:ash linear infinite;pointer-events:none}
.warn.gray{color:#ccc;animation:blink 1.6s infinite}
</style>
<style>
/* ===== 見た目の強化(中身は元のまま) ===== */
#bgScene,#fxLayer{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#bgScene{z-index:-1}
#fxLayer{z-index:8}
body{background:#05060f;background-image:none}
#app{position:relative;z-index:1;padding:10px 10px 18px}
.win{position:relative;background:linear-gradient(180deg,rgba(28,37,88,.86) 0%,rgba(17,24,64,.86) 55%,rgba(11,16,48,.9) 100%);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);border:3px solid #efeaff;border-radius:10px;
  box-shadow:0 0 0 3px #000,0 0 0 5px #4a3fa8,0 0 0 7px #000,inset 0 2px 0 rgba(255,255,255,.14),inset 0 -3px 0 rgba(0,0,0,.35),0 14px 28px rgba(0,0,0,.55)}
.win::before,.win::after{content:'';position:absolute;width:9px;height:9px;background:linear-gradient(135deg,#fff6b0,#ffb020);transform:rotate(45deg);box-shadow:0 0 0 2px #000,0 0 8px #ffd84a;top:-7px;z-index:2}
.win::before{left:-7px}.win::after{right:-7px}
/* タイトル */
.head{padding:4px 0 2px}
h1{font-size:24px;letter-spacing:3px;color:#ffe680;background:linear-gradient(180deg,#fffbe0 0%,#ffd84a 45%,#ff9a1a 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(2px 2px 0 #5a2200) drop-shadow(0 0 10px rgba(255,200,60,.55));animation:logo 3s ease-in-out infinite}
@keyframes logo{50%{filter:drop-shadow(2px 2px 0 #5a2200) drop-shadow(0 0 18px rgba(255,220,100,.9))}}
#mute{font-size:13px;padding:4px 8px;background:linear-gradient(#3a4fb0,#1d2a66);animation:none}
/* 勇者パネル */
.heroWrap{position:relative;width:48px;height:48px;flex:none;display:flex;align-items:center;justify-content:center}
.heroWrap::before{content:'';position:absolute;inset:-6px;border-radius:50%;background:radial-gradient(circle,rgba(255,216,74,.35),transparent 70%);animation:heroGlow 2.4s ease-in-out infinite}
.heroWrap canvas{position:relative;animation:bob 1.8s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
@keyframes heroGlow{50%{transform:scale(1.15);opacity:.6}}
.name{font-size:16px;text-shadow:2px 2px 0 #000}
#heroName{color:#fff6c8}
.hpbar{height:12px;border:2px solid #fff;border-radius:7px;background:#2a0008;overflow:hidden;box-shadow:0 0 0 2px #000}
.hpbar i{z-index:1;border-radius:4px;background:linear-gradient(180deg,#b6ffc4 0%,#3fe06a 45%,#17a043 100%);box-shadow:inset 0 2px 0 rgba(255,255,255,.45)}
.hpbar i.low{background:linear-gradient(180deg,#ffc0b0 0%,#ff4a3a 50%,#b01020 100%);animation:lowHp .6s infinite alternate}
.hpbar .trail{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(#fff,#ffd0a0);transition:width .55s cubic-bezier(.3,.7,.2,1);z-index:0}
@keyframes lowHp{to{filter:brightness(1.5)}}
.stats{gap:3px 14px;margin-top:8px}
.stats div{background:rgba(0,0,0,.25);border-radius:4px;padding:1px 6px;border:1px solid rgba(255,255,255,.08)}
.stats .v{color:#ffe36a;text-shadow:0 0 6px rgba(255,216,74,.6),1px 1px 0 #000}
.stats.roll div{animation:roll .05s}
@keyframes roll{from{background:rgba(255,216,74,.35)}}
.sub{color:#c6ccff}
/* ステージ */
#stage{min-height:290px;background:radial-gradient(ellipse 70% 38% at 50% 88%,rgba(140,120,255,.32),transparent 70%),radial-gradient(circle at 50% 0%,rgba(90,110,255,.18),transparent 60%),linear-gradient(180deg,rgba(21,28,72,.55) 0%,rgba(12,17,48,.7) 70%,rgba(8,11,32,.85) 100%)}
#stage.king{background:radial-gradient(ellipse 70% 38% at 50% 88%,rgba(255,60,60,.38),transparent 70%),linear-gradient(180deg,#3a0814 0%,#1a0208 100%)}
.note{color:#dfe3ff;text-shadow:1px 1px 0 #000}
#eWrap{position:relative;animation:appear .55s cubic-bezier(.2,1.5,.4,1),float 2.6s .55s ease-in-out infinite}
#eWrap::after{content:'';position:absolute;left:12%;right:12%;bottom:-10px;height:14px;background:radial-gradient(ellipse,rgba(0,0,0,.6),transparent 70%);z-index:-1}
@keyframes appear{from{transform:scale(.2) translateY(30px);opacity:0;filter:brightness(4)}}
@keyframes float{50%{transform:translateY(-6px)}}
.ename{font-size:18px;text-shadow:2px 2px 0 #000,0 0 10px rgba(255,255,255,.25)}
.estats span{background:rgba(0,0,0,.28);border-radius:3px;padding:0 3px}
.warn{font-size:22px;text-shadow:2px 2px 0 #000,0 0 14px currentColor}
/* カード */
.card{width:132px;height:184px}
.card:not(.flipped){animation:cardFloat 2.6s ease-in-out infinite}
.card.tremble{animation:tremble .08s 5}
@keyframes cardFloat{50%{transform:translateY(-6px) rotate(-1deg)}}
.card .b{overflow:hidden;background:radial-gradient(circle at 50% 50%,#6a3ad0 0%,transparent 55%),repeating-linear-gradient(45deg,#3a1a6b 0 8px,#2a1050 8px 16px);font-size:46px;text-shadow:3px 3px 0 #000,0 0 18px #ffd84a;box-shadow:0 0 0 3px #000,0 0 22px rgba(160,120,255,.6)}
.card .b::before{content:'';position:absolute;inset:7px;border:2px solid rgba(255,216,74,.55);border-radius:5px}
.card .b::after{content:'';position:absolute;inset:-20%;background:linear-gradient(110deg,transparent 42%,rgba(255,255,255,.4) 50%,transparent 58%);animation:shine 2.6s ease-in-out infinite}
@keyframes shine{0%{transform:translateX(-70%)}60%,100%{transform:translateX(70%)}}
.card.kingcard .b{background:radial-gradient(circle,#c01030 0%,transparent 55%),repeating-linear-gradient(45deg,#6b0c1a 0 8px,#45040e 8px 16px);box-shadow:0 0 0 3px #000,0 0 26px rgba(255,40,40,.7)}
.card .f{background:radial-gradient(circle at 50% 40%,#3a2a55,#140a14);box-shadow:0 0 0 3px #000,0 0 26px rgba(255,255,255,.35)}
.mc{border-radius:4px;background:linear-gradient(#5a2ea0,#2a1258);box-shadow:0 2px 0 #000}
.mc.cur{animation:curPulse .8s infinite alternate}
@keyframes curPulse{to{box-shadow:0 0 0 2px var(--gold),0 0 12px var(--gold)}}
.mc.king{background:linear-gradient(#c01a30,#5a0612)}
/* ダメージ数字 */
.pop{font-size:30px;color:#fff;text-shadow:3px 3px 0 #000,-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000;animation:popIn 1s cubic-bezier(.2,1.4,.4,1) forwards}
.pop.crit{font-size:40px;color:#ffe14a;text-shadow:3px 3px 0 #7a2a00,-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000,0 0 18px #ffb000}
.pop.mag{color:#d6b8ff;text-shadow:3px 3px 0 #2a0a5a,-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000,0 0 14px #a070ff}
@keyframes popIn{0%{transform:translate(-50%,10px) scale(.3);opacity:0}18%{transform:translate(-50%,-14px) scale(1.35);opacity:1}35%{transform:translate(-50%,-20px) scale(1)}100%{transform:translate(-50%,-60px) scale(1);opacity:0}}
/* メッセージ */
#msg{background:linear-gradient(180deg,#0e1436,#070a1e);font-size:15px}
#msg p{text-shadow:1px 1px 0 #000}
#msg p:not(:last-of-type){opacity:.62}
#msg p:last-of-type{animation:msgIn .28s ease-out}
#msg p:last-of-type::before{content:'▶ ';color:#ffd84a;font-size:11px}
@keyframes msgIn{from{opacity:0;transform:translateX(-10px)}}
#speed{background:linear-gradient(#2a3a8a,#151f55);animation:none}
/* ボタン */
button{background:linear-gradient(180deg,#4a62d0 0%,#2a3c96 50%,#1b2766 100%);border-radius:8px;text-shadow:2px 2px 0 #000;box-shadow:0 5px 0 #000,inset 0 2px 0 rgba(255,255,255,.35),inset 0 -3px 0 rgba(0,0,0,.25);transition:filter .15s}
button:hover{filter:brightness(1.12)}
button:active{transform:translateY(4px);box-shadow:0 1px 0 #000,inset 0 2px 0 rgba(255,255,255,.25)}
button.red{background:linear-gradient(180deg,#ff7a5a 0%,#d0383a 50%,#7a1420 100%);animation:redGlow 1.6s ease-in-out infinite}
@keyframes redGlow{50%{box-shadow:0 5px 0 #000,inset 0 2px 0 rgba(255,255,255,.35),0 0 18px rgba(255,90,60,.75)}}
#controls button{animation-name:btnIn,redGlow;animation-duration:.3s,1.6s;animation-iteration-count:1,infinite;animation-timing-function:cubic-bezier(.2,1.4,.4,1),ease-in-out}
#controls button:not(.red){animation:btnIn .3s cubic-bezier(.2,1.4,.4,1)}
@keyframes btnIn{from{transform:translateY(12px) scale(.9);opacity:0}}
/* アイテム獲得 */
.itemget{overflow:hidden}
.itemget::before{content:'';position:absolute;left:50%;top:45%;width:520px;height:520px;margin:-260px 0 0 -260px;background:repeating-conic-gradient(rgba(255,216,74,.22) 0 9deg,transparent 9deg 18deg);border-radius:50%;-webkit-mask:radial-gradient(circle,#000 10%,transparent 62%);mask:radial-gradient(circle,#000 10%,transparent 62%);animation:spin 9s linear infinite}
.itemget>*{position:relative}
.itemget canvas{animation:itemPop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes itemPop{from{transform:scale(0) rotate(-30deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
.big{text-shadow:3px 3px 0 #7a3b00,0 0 20px rgba(255,216,74,.7);animation:bigIn .8s cubic-bezier(.2,1.4,.4,1)}
@keyframes bigIn{from{transform:scale(2.2);opacity:0;letter-spacing:12px}}
/* 箱 */

let actx = null, master, musicGain, nbuf, muted = false, seq = null;
function ac() {

    musicGain = actx.createGain(); musicGain.gain.value = 0.55; musicGain.connect(master);

  if (o.to) f.frequency.exponentialRampToValueAtTime(o.to, t + dur);
  const g = a.createGain(); g.gain.setValueAtTime(o.vol ?? 0.3, t); g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
  s.connect(f).connect(g).connect(o.dest || master); s.start(t); s.stop(t + dur + 0.05);

const now = () => ac().currentTime;
const SFX = {
  click() { tone(880, .05, { vol: .1 }); tone(1320, .06, { vol: .08, at: now() + .04 }); },
  tick() { tone(R(900, 1600), .025, { vol: .04 }); },

function monPal(style) {
  const h = R(0, 359);
  if (style === 'cute') return { o: '#2a1a1a', b: `hsl(${h},75%,78%)`, d: `hsl(${h},55%,58%)`, a: 'hsl(30,95%,58%)', w: '#fff', k: '#222', r: '#ff6b6b', y: '#ffd84a', p: '#ff9ec4' };
  if (style === 'scary') return { o: '#000', b: `hsl(${h},30%,32%)`, d: `hsl(${h},35%,16%)`, a: `hsl(${R(0, 20)},85%,42%)`, w: '#d8d8d8', k: '#000', r: '#ff1a1a', y: '#ffcc00', p: '#a03040' };
  return { o: '#0a0a12', b: `hsl(${h},65%,55%)`, d: `hsl(${h},65%,33%)`, a: `hsl(${(h + 160) % 360},90%,62%)`, w: '#fff', k: '#000', r: '#ff3b3b', y: '#ffd84a', p: '#ff8fb0' };
}
function draw(cv, map, pal, scale) {
  cv.width = 16 * scale; cv.height = 16 * scale;
  const c = cv.getContext('2d'); c.clearRect(0, 0, cv.width, cv.height);
  map.forEach((row, y) => {
    row = row.padEnd(16, '.').slice(0, 16);
    for (let x = 0; x < 16; x++) {
      const col = pal[row[x]]; if (!col) continue;
      c.fillStyle = col; c.fillRect(x * scale, y * scale, scale, scale);
    }
  });
  return cv;
}
const mkCv = (map, pal, scale) => draw(document.createElement('canvas'), map, pal, scale);
// 勇者の見た目：変身ごとに別のドット絵
function heroLook() {
  const t = hero && hero.title;
  if (t === '破滅の王') return { spr: SPR.hero, pal: PAL.heroDoom, aura: 'doom' };
  if (t === '女神') return { spr: SPR.heroGoddess, pal: PAL.heroGoddess, aura: 'goddess' };
  if (t === '運のいいやつ') return { spr: SPR.heroLucky, pal: PAL.heroLucky, aura: 'lucky' };
  return { spr: SPR.hero, pal: PAL.hero, aura: '' };
}
function heroCv(scale) { const L = heroLook(); const c = mkCv(L.spr, L.pal, scale); if (L.aura) c.classList.add('aura-' + L.aura); return c; }

function rollStat() {
  const total = CFG.statTiers.reduce((a, t) => a + t[0], 0);
  let x = Math.random() * total;
  for (const [w, lo, hi] of CFG.statTiers) { if ((x -= w) < 0) return R(lo, hi); }
  const t = CFG.statTiers[CFG.statTiers.length - 1]; return R(t[1], t[2]);
}

function renderHero(dead) {
  const b = hero.base;
  $('#heroName').textContent = hero.title;
  const L = heroLook();
  draw($('#heroCv'), L.spr, dead ? grayPal(L.pal) : L.pal, 3);
  $('#heroCv').className = !dead && L.aura ? 'aura-' + L.aura : '';
  $('#hpTxt').textContent = `HP ${Math.max(0, hero.hp)} / ${hero.maxhp}`;
  const r = Math.max(0, hero.hp / hero.maxhp);
  const bar = $('#hpBar'); bar.style.width = (r * 100) + '%'; bar.classList.toggle('low', r < 0.3);
  const wp = sum(hero.weapons), ap = sum(hero.armors), mp = sum(hero.mguards), sp = sum(hero.staffs);
  $('#heroStats').innerHTML = KEYS.map(k => {
    let plus = '';
    if (k === 'hp' && hero.maxhp > b.hp) plus = `<span class="plus">+${hero.maxhp - b.hp}</span>`;
    if (k === 'atk' && wp) plus = `<span class="plus">+${wp}</span>`;
    if (k === 'def' && ap) plus = `<span class="plus">+${ap}</span>`;
    if (k === 'mag' && sp) plus = `<span class="plus">+${sp}</span>`;
    if (k === 'mdf' && mp) plus = `<span class="plus">+${mp}</span>`;
    return `<div><span>${LABEL[k]}</span><span><span class="v">${b[k]}</span>${plus}</span></div>`;
  }).join('');
  const eq = [...hero.weapons, ...hero.armors, ...hero.mguards, ...hero.staffs];
  $('#equipTxt').textContent = (eq.length ? '装備：' + eq.map(i => `${i.name}(+${i.bonus})`).join('、') : '装備：なし') +

async function birth() {
  setControls([]);
  const final = rollHero();
  // 0.0001%の奇跡：特別な勇者
  let special = null;
  const fb = force.startsWith('born-') ? force.slice(5) : '';
  if (fb) force = '';
  for (const sb of SPECIAL_BIRTHS) if (fb === sb.key || Math.random() < CFG.specialBirthRate) { special = sb; break; }
  if (special) final[special.stat] = 10000;
  if (window.slotReveal) await slotReveal(final);
  else { const t0 = Date.now();
  while (Date.now() - t0 < 600) {
    KEYS.forEach(k => hero.base[k] = rollStat());
    hero.maxhp = hero.hp = hero.base.hp; renderHero(); SFX.tick(); await sleep(50);
  } }
  hero.base = final; hero.maxhp = hero.hp = final.hp; hero.title = special ? special.title : '勇者';
  if (special) {
    $('#dim').style.opacity = .8; await sleep(500);
    SFX.sage(); await lightning(); quake();
    $('#dim').style.opacity = 0;
    renderHero();
    await say(`奇跡！「${special.title}」誕生！ ${LABEL[special.stat]}10000！`, 'gold');
  } else { renderHero(); SFX.join(); }
  fx($('#heroPanel'), 'blink');
  const gifts = KEYS.filter(k => final[k] > CFG.giftLine);  // 1000を超えた「当たり」のステータス
  const best = KEYS.reduce((a, k) => final[k] > final[a] ? k : a, 'hp');
  const worst = KEYS.reduce((a, k) => final[k] < final[a] ? k : a, 'hp');
  const rank = pick(RANKS[Math.min(gifts.length, RANKS.length - 1)]);
  await say(`誕生！ 評価：${rank}`, 'gold');
  if (gifts.length) await say(`才能：${gifts.map(k => LABEL[k]).join('・')}`, 'good');
  game = { n: R(CFG.cardsMin, CFG.cardsMax), idx: 0, res: [] };
  await say(`カード${game.n}枚。最後は魔王。`);
  setControls([
    [`旅に出る<small>カード ${game.n}枚</small>`, deckView, 'red'],
    ['もう一度 誕生する<small>ステータスを 引き直す</small>', birth]
  ]);

}

async function flip() {

const MONS = {

  penguin: ['ペンギン', .1], mushroom: ['キノコ', .13], frog: ['カエル', .16], snowman: ['ゆきだるま', .2],

const recruitChance = () => CFG.recruitMin + (CFG.recruitMax - CFG.recruitMin) * Math.min(1, hero.base.luk / CFG.recruitLuck);
function battleControls() {

async function act(kind) {
  if (busy) return; busy = true; setControls([]);
  const e = enemy;
  if (kind === 'hit') {
    const { dmg, crit } = physical(atkOf(), e.def, hero.base.luk);

  } else if (kind === 'magic') {
    SFX.magic();
    const dmg = magical(magOf(), e.mdf);
    hitEnemy(dmg); popup(dmg, 'mag');
    await say(`${pick(['ファイア', 'ブリザド', 'サンダー', 'メテオ'])}！ ${dmg}ダメージ`);
  } else {
    SFX.talk();
    if (e.boss === 'king') {
      await say(pick(['魔王「笑わせるな。」', '魔王「無意味だ。」']));

      await say(pick(e.rare.refuse), e.rare.txt);

        if (e.rare) { calm(); SFX.sage(); hero.rareDown.push(e.name + '(仲間)'); }
        else SFX.join();
        hero.allies.push({ ...e, hp: e.maxhp }); renderHero();

      } else {
        await say(`満員… ${e.name}は 去った。`);

      return finishCard(e.rare ? '裏' : '仲');
    } else {
      await say(pick(INSULTS));

  }
  if (e.hp <= 0) return victory();

  for (const a of hero.allies) {
    // 敵だったときのステータスのまま戦う：攻撃力と魔力の高い方で攻撃
    const useMag = a.mag > a.atk;
    let dmg, crit = false;
    if (useMag) { dmg = magical(a.mag, e.mdf); SFX.magic(); }
    else { ({ dmg, crit } = physical(a.atk, e.def, a.luk)); crit ? SFX.crit() : SFX.hit(); }

  if (hero.hp <= 0 && !(await tryRevive())) return defeat();

}

async function enemyTurn() {
  const e = enemy, r = e.rare;
  if (r && Math.random() < r.idle) { await say(rText(r), r.txt); return; }
  const useMag = e.mag > e.atk ? Math.random() < 0.75 : Math.random() < 0.25;
  let dmg, head;
  if (useMag) {
    head = (e.boss === 'king' ? pick(['ヘルフレイム', '終焉の雷', '暗黒の波動'])
      : r ? pick(r.spells) : pick(['あやしい光', 'どくの霧', 'こおりの息', 'ほのおの玉'])) + '！';
    if (e.boss === 'creator') { SFX.rumble(); SFX.holy(); lightning(); }
    else if (r && r.entrance.startsWith('thunder')) { SFX.thunder(); lightning(); } else SFX.magic();
    dmg = magical(e.mag, mdfOf());
  } else {
    const res = physical(e.atk, defOf(), e.luk);
    dmg = res.dmg;
    head = res.crit ? '痛恨の一撃！' : `${e.name}の攻撃！`;
  }
  SFX.hurt();
  hero.hp -= dmg; renderHero();
  fx($('#heroPanel'), 'flash');
  if (e.boss) quake();
  await say(`${head} ${dmg}ダメージ`, 'dmg');
}

// 中身を決める（small=true の小さい箱は 少しだけ良いものが出やすい）
const WNAMES = ['つるぎ', 'おの', 'やり', 'ハンマー'], ANAMES = ['たて', 'よろい', 'かぶと', 'マント'];
// 装備の種類：剣(攻撃力)・防具(防御力)・魔よけ(魔法防御)
const MNAMES = ['ローブ', 'おまもり', 'ティアラ', 'ゆびわ'];
const EQUIP = {
  weapon: { list: 'weapons', stat: '攻撃力', short: '攻', names: WNAMES, spr: 'sword', pal: 'sword', sagePal: 'sageSword', sage: '賢者の剣', sup: '天上の剣' },
  armor:  { list: 'armors', stat: '防御力', short: '防', names: ANAMES, spr: 'shield', pal: 'shield', sagePal: 'sageShield', sage: '賢者の防具', sup: '天上の鎧' },
  staff:  { list: 'staffs', stat: '魔力', short: '魔', names: ['つえ', 'まどうしょ', 'すいしょう', 'ロッド'], spr: 'staff', pal: 'staff', sagePal: 'sageStaff', sage: '賢者の杖', sup: '天上の杖' },
  mguard: { list: 'mguards', stat: '魔法防御', short: '魔防', names: MNAMES, spr: 'amulet', pal: 'amulet', sagePal: 'sageAmulet', sage: '賢者のローブ', sup: '天上の護符' }
};
const EKINDS = Object.keys(EQUIP);
// 攻撃力（または魔力）が5000以上なら、その系統の装備が出やすく、反対の系統は出にくい
function kindWeight(k) {
  const atkHi = atkOf() >= CFG.focusLine, magHi = magOf() >= CFG.focusLine;
  if (atkHi === magHi) return 1;                 // どちらも低い／どちらも高い → かたよりなし
  const fav = atkHi ? 'weapon' : 'staff', unfav = atkHi ? 'staff' : 'weapon';
  return k === fav ? CFG.focusUp : k === unfav ? CFG.focusDown : 1;
}
function pickKind(list) {
  const w = list.map(kindWeight), t = w.reduce((a, b) => a + b, 0);
  let x = Math.random() * t;
  for (let i = 0; i < list.length; i++) if ((x -= w[i]) < 0) return list[i];
  return list[list.length - 1];
}
const eqName = (k, bonus) => pick(TIER.find(t => bonus < t[0])[1]) + pick(EQUIP[k].names);
function rollLoot(small, f) {
  // 超レア箱：外からは普通の箱に見える（トーテムか +10000装備）
  if (f === 'super' || Math.random() < CFG.superBoxRate) {
    const k = pickKind(['totem', ...EKINDS]);
    if (k === 'totem') return { kind: 'totem', name: 'トーテム', superRare: true };
    return { kind: k, superRare: true, bonus: CFG.superBonus, name: EQUIP[k].sup };
  }
  // レア箱の上乗せ：+5000〜10000の装備
  if (Math.random() < CFG.rareBoxBoost) {
    const k = pickKind(EKINDS), bonus = R(5000, CFG.itemMax);
    return { kind: k, bonus, name: eqName(k, bonus) };
  }
  if (f === 'sage' || Math.random() < (small ? CFG.smallSageRate : CFG.sageRate)) {
    const k = pickKind(EKINDS);
    return { kind: k, sage: true, bonus: CFG.sageBonus, name: EQUIP[k].sage };
  }
  if (f === 'totem' || Math.random() < (small ? CFG.smallTotemRate : CFG.totemRate)) return { kind: 'totem', name: 'トーテム' };
  const kind = pickKind(['potion', ...EKINDS]);
  if (kind === 'potion') return { kind, v: R(small ? CFG.smallPotionMin : CFG.potionMin, CFG.potionMax), name: 'ポーション' };
  const r = small ? Math.pow(Math.random(), CFG.smallBias) : Math.random();
  const bonus = Math.round(CFG.itemMin * Math.pow(CFG.itemMax / CFG.itemMin, r));
  return { kind, bonus, name: eqName(kind, bonus) };
}
function lootIcon(l, scale) {
  if (l.kind === 'totem') return mkCv(SPR.totem, PAL.totem, scale);
  if (l.kind === 'potion') return mkCv(SPR.potion, PAL.potion, scale);
  const q = EQUIP[l.kind];
  return mkCv(SPR[q.spr], PAL[(l.sage || l.superRare) ? q.sagePal : q.pal], scale);
}
const lootVal = l => l.kind === 'totem' ? '1回復活' : l.kind === 'potion' ? `最大HP+${l.v}` : `${EQUIP[l.kind].short}+${l.bonus}`;
async function applyLoot(l) {

// 落雷：カードの真上から稲妻が落ちる
async function strikeCard(el) {
  const st = $('#stage'), sr = st.getBoundingClientRect(), cr = el.getBoundingClientRect();
  const cx = cr.left - sr.left + cr.width / 2, by = cr.top - sr.top + cr.height / 2;
  let pts = [], y = 0, x = cx + R(-20, 20);
  while (y < by) { pts.push(`${x},${y}`); y += R(14, 26); x = cx + R(-16, 16); }
  pts.push(`${cx},${by}`);
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('class', 'strike'); svg.setAttribute('width', sr.width); svg.setAttribute('height', sr.height);
  svg.innerHTML = `<polyline points="${pts.join(' ')}" fill="none" stroke="#fff6b0" stroke-width="7" stroke-linejoin="bevel"/>` +
                  `<polyline points="${pts.join(' ')}" fill="none" stroke="#fff" stroke-width="3" stroke-linejoin="bevel"/>`;
  st.append(svg);
  SFX.thunder(); lightning(); quake();
  await sleep(450); svg.remove();
}

// 大・中・小の箱から1つ選ぶ。カードを下から上へスワイプ（またはタップ）でめくる
function chooseBox(f) {
  return new Promise(resolve => {
    const boxes = [['大', 6, false], ['中', 4.5, false], ['小', 3, true]];
    const loot = boxes.map(b => rollLoot(b[2], f));
    $('#stage').style.background = '';
    $('#stage').innerHTML = `<div class="center"><div class="note">箱を ひとつ えらべ</div><div class="pickrow"></div><div class="pickhint">↑ 下から上へ スワイプで めくる</div></div>`;
    const row = $('#stage .pickrow');
    const cards = boxes.map((b, i) => {
      const el = document.createElement('div'); el.className = 'pcard' + (isRareLoot(loot[i]) ? ' rare' : '');
      el.innerHTML = `<div class="in"><div class="b"></div><div class="f"></div></div>`;
      const back = el.querySelector('.b');
      back.append(window.mkChest ? mkChest(b[1]) : mkCv(SPR.box, PAL.box, b[1]));
      back.insertAdjacentHTML('beforeend', `<span>${b[0]}</span>`);
      if (isRareLoot(loot[i])) {                                // きらきら
        for (let k = 0; k < 7; k++) {
          const sp = document.createElement('i'); sp.className = 'spark'; sp.textContent = pick(['✦', '✧', '✦']);
          sp.style.left = R(4, 82) + '%'; sp.style.top = R(4, 86) + '%';
          sp.style.animationDelay = -R(0, 120) / 100 + 's'; sp.style.animationDuration = R(80, 140) / 100 + 's';
          back.append(sp);
        }
      }
      const fr = el.querySelector('.f');
      fr.append(lootIcon(loot[i], 3));
      fr.insertAdjacentHTML('beforeend', `<div>${loot[i].superRare ? '★' + loot[i].name : loot[i].sage ? '✦' + loot[i].name : loot[i].name}</div><div class="v">${lootVal(loot[i])}</div>`);
      row.append(el); return el;
    });
    say(loot.some(isRareLoot) ? '…どれかが 光っている！' : '箱を ひとつ えらべ！', 'gold');
    let done = false;
    cards.forEach((el, i) => {
      const inner = el.querySelector('.in');
      let y0 = null, dy = 0, moved = 0;
      el.addEventListener('pointerdown', ev => {
        if (done) return; y0 = ev.clientY; dy = 0; moved = 0;
        el.classList.add('dragging'); try { el.setPointerCapture(ev.pointerId); } catch (_) {}
      });
      el.addEventListener('pointermove', ev => {
        if (y0 === null || done) return;
        dy = ev.clientY - y0; moved = Math.max(moved, Math.abs(dy));
        const a = Math.max(0, Math.min(110, -dy * 1.1));       // 上方向だけ めくれる
        inner.style.transform = `rotateX(${a}deg) translateY(${-a / 8}px)`;
      });
      const end = async () => {
        if (y0 === null || done) return;
        y0 = null; el.classList.remove('dragging');
        if (dy < -45 || moved < 6) {                           // 上へスワイプ or タップ → めくる
          done = true; ac();
          cards.forEach((c, j) => { if (j !== i) c.classList.add('other'); });
          if (loot[i].superRare) {                             // 超レア：1秒 真っ暗になってから
            const dim = $('#dim'); dim.style.transition = 'opacity .25s'; dim.style.opacity = .97;
            tone(45, 1.2, { type: 'sine', to: 30, vol: .5 });
            await sleep(1000);
            dim.style.opacity = 0; await sleep(250); dim.style.transition = '';
          }
          if (window.openLid) await openLid(el, isRareLoot(loot[i]));
          SFX.flip(); inner.style.transform = 'rotateX(180deg)';
          await sleep(650);
          cards.forEach((c, j) => { if (j !== i) c.querySelector('.in').style.transform = 'rotateX(180deg)'; });
          await sleep(500);
          await applyLoot(loot[i]);
          resolve();
        } else {
          inner.style.transform = '';                          // 足りない・下向き → 戻る
        }
      };
      el.addEventListener('pointerup', end);
      el.addEventListener('pointercancel', () => { y0 = null; el.classList.remove('dragging'); inner.style.transform = ''; });
    });
  });
}

<script>
// ===== 見た目の強化(元のゲーム処理には手を入れず、外側から演出を足す) =====
(function () {
  const bg = document.getElementById('bgScene'), bx = bg.getContext('2d');

  const rnd = Math.random;

  let mts = [];
  function buildMts() {
    mts = [0, 1, 2].map(L => { const pts = []; let x = 0; const base = .62 + L * .09, amp = .09 - L * .02; while (x <= 1.05) { pts.push([x, base - rnd() * amp - (L === 0 && Math.abs(x - .72) < .03 ? .06 : 0)]); x += .04 + rnd() * .05; } return pts; });
  }
  const fog = Array.from({ length: 7 }, (_, i) => ({ x: rnd(), y: .62 + rnd() * .3, w: .5 + rnd() * .5, v: (rnd() * .006 + .002) * (i % 2 ? 1 : -1) }));
  const motes = Array.from({ length: 40 }, () => ({ x: rnd(), y: rnd(), v: .02 + rnd() * .05, p: rnd() * 6, r: .8 + rnd() * 1.8 }));

    if (happy) { top = [70, 60, 140]; bot = [255, 170, 130]; }
    if (tense && !despair) { const c = tcRGB(); top = [Math.round(c[0] * .18), Math.round(c[1] * .1), Math.round(c[2] * .14)]; bot = [Math.round(c[0] * .45), Math.round(c[1] * .25), Math.round(c[2] * .35)]; }
    const mix = (a, b) => a.map((v, i) => Math.round(v * (1 - gloom) + b[i] * gloom));
    top = mix(top, [0, 0, 0]); bot = mix(bot, [18, 18, 18]);
    const g = bx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, `rgb(${top})`); g.addColorStop(.7, `rgb(${bot})`); g.addColorStop(1, `rgb(${top})`);

    bx.fillStyle = gloom > .5 ? '#888' : happy ? '#fff2c8' : tense ? '#ffb0a0' : '#eef2ff'; bx.beginPath(); bx.arc(mx, my, 22, 0, 7); bx.fill();
    bx.fillStyle = `rgb(${top})`; bx.globalAlpha = .9; bx.beginPath(); bx.arc(mx + 9, my - 5, 19, 0, 7); bx.fill(); bx.globalAlpha = 1;
    // 星
    for (const s of stars) { bx.globalAlpha = (1 - gloom * .7) * (.35 + .65 * Math.abs(Math.sin(t * 1.3 + s.p))); bx.fillStyle = '#fff'; bx.fillRect(s.x * W, s.y * H, s.r, s.r); }
    bx.globalAlpha = 1;
    // 山と魔王城
    mts.forEach((pts, L) => {
      const shade = [[28, 22, 66], [18, 14, 44], [10, 8, 26]][L].map((v, i) => tense ? Math.round(v * .7 + tcRGB()[i] * .08 * (3 - L)) : v);
      bx.fillStyle = `rgb(${mix(shade, [10, 10, 10])})`; bx.beginPath(); bx.moveTo(0, H);
      pts.forEach(([x, y]) => bx.lineTo(x * W, y * H)); bx.lineTo(W, H); bx.closePath(); bx.fill();
      if (L === 0) { const cx = W * .72, cy = H * .6; bx.fillRect(cx - 14, cy - 34, 28, 34); bx.fillRect(cx - 24, cy - 22, 8, 22); bx.fillRect(cx + 16, cy - 22, 8, 22); bx.beginPath(); bx.moveTo(cx - 16, cy - 34); bx.lineTo(cx, cy - 54); bx.lineTo(cx + 16, cy - 34); bx.fill();
        bx.fillStyle = tense ? '#ff4030' : '#ffcf6a'; bx.globalAlpha = .6 + .4 * Math.sin(t * 3); bx.fillRect(cx - 3, cy - 26, 6, 6); bx.globalAlpha = 1; }
    });

    let d; try { d = cv.getContext('2d').getImageData(0, 0, cv.width, cv.height).data; } catch (e) { return; }
    const sc = cv.width / 16, px = r.width / 16, cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) {
      const i = ((Math.floor(y * sc + sc / 2)) * cv.width + Math.floor(x * sc + sc / 2)) * 4; if (d[i + 3] < 10) continue;
      const X = r.left + x * px + px / 2, Y = r.top + y * px + px / 2, a = Math.atan2(Y - cy, X - cx), sp = (big ? 90 : 60) + rnd() * (big ? 240 : 160);
      F.add({ x: X, y: Y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 80, g: 420, life: (big ? 1.6 : 1) * (.6 + rnd() * .6), s: px * .95, c: `rgb(${d[i]},${d[i + 1]},${d[i + 2]})`, shape: 'spark', vr: (rnd() - .5) * 8, t: big ? -rnd() * .3 : 0 });
    }
    cv.style.visibility = 'hidden';
    if (big) { F.flashScreen(.9, 700); F.kick(12); [0, 180, 380, 620].forEach((ms, i) => setTimeout(() => { F.burst(st(), { n: 30, c: ['#fff', '#ffd84a', '#ff6a2a'], sp: 260, s: 4, spread: .5 }); F.kick(8 - i); noise(.4, { freq: 300, vol: .5 }); }, ms)); }
    else noise(.25, { type: 'bandpass', freq: 1800, to: 400, vol: .25 });
  }
  const _vic = victory; victory = async function (...a) { try { shatter(enemyCv(), !!enemy.boss); } catch (e) {} return _vic.apply(this, a); };

  // ---------- ダメージ数字:桁で大きく ----------
  const _pop2 = popup; popup = function (text, cls = '') {
    const r = _pop2.call(this, text, cls); const p = document.querySelector('#stage .pop:last-of-type');
    const n = Number(text) || 0, dg = String(Math.floor(n)).length;
    if (p) { const base = cls.includes('crit') ? 40 : 30; p.style.fontSize = Math.round(base * (.75 + dg * .12)) + 'px'; if (n >= 10000) { p.classList.add('huge'); F.kick(12); F.flashScreen(.4, 300, '#ffd0a0'); } else if (n >= 1000) F.kick(5); }
    return r;
  };

  // ---------- 誕生:スロット ----------
  window.slotReveal = async function (final) {
    const s = st(); s.className = 'win'; s.style.background = ''; s.innerHTML = '';
    const wrapEl = document.createElement('div'); wrapEl.className = 'center';
    wrapEl.innerHTML = `<div class="slotTitle">― 才能ガチャ ―</div><div class="slot">${KEYS.map(k => `<div class="reel spin" data-k="${k}"><div class="lb">${LABEL[k]}</div><div class="num">0</div></div>`).join('')}</div><div class="slotRank" id="slotRank"></div>`;
    s.append(wrapEl);
    const stopped = {}; const quick = fast;
    let tick = setInterval(() => {
      KEYS.forEach(k => { if (stopped[k] == null) { const v = rollStat(); hero.base[k] = v; const el = s.querySelector(`.reel[data-k="${k}"] .num`); if (el) el.textContent = v; } });
      hero.maxhp = hero.hp = hero.base.hp; renderHero(); SFX.tick();
    }, 55);
    await sleep2(quick ? 250 : 650);
    for (const k of KEYS) {
      stopped[k] = final[k]; hero.base[k] = final[k];
      const reel = s.querySelector(`.reel[data-k="${k}"]`); reel.classList.remove('spin'); reel.querySelector('.num').textContent = final[k];
      void reel.offsetWidth; reel.classList.add('stop');
      tone(140, .12, { type: 'square', to: 70, vol: .2 }); noise(.05, { freq: 2000, vol: .2 });
      if (final[k] > CFG.giftLine) {
        reel.classList.add('gift'); reel.insertAdjacentHTML('beforeend', '<span class="stamp">才能</span>');
        const t = now(); [76, 81, 88].forEach((m, i) => tone(mf(m), .18, { type: 'triangle', vol: .12, at: t + i * .05 }));
        F.burst(reel, { n: 16, c: ['#ffd84a', '#fff6b0'], sp: 140, shape: 'star', life: .7 });
      }
      await sleep2(quick ? 140 : 380);
    }
    clearInterval(tick);
    const gifts = KEYS.filter(k => final[k] > CFG.giftLine).length;
    const box = s.querySelector('.slot');
    if (gifts === 0) { F.burst(box, { n: 26, c: ['#777', '#999', '#555'], sp: 50, g: -40, s: 7, life: 1.2, spread: .8 }); noise(.5, { freq: 500, to: 150, vol: .3 }); }
    else if (gifts === 1) { F.burst(box, { n: 20, c: ['#fff6b0', '#fff'], sp: 120, shape: 'star' }); }
    else if (gifts === 2) { F.burst(box, { n: 36, c: ['#ffd84a', '#fff6b0', '#fff'], sp: 200, shape: 'star', s: 4 }); F.ring(box, '#ffd84a', 120); }
    else if (gifts === 3) { F.flashScreen(.35, 400, '#fff6b0'); F.burst(box, { n: 50, c: ['#ffd84a', '#fff6b0', '#fff', '#ff9a2a'], sp: 260, shape: 'star', s: 4 }); F.ring(box, '#ffd84a', 160); F.kick(6); }
    else {
      wrapEl.classList.add('tier4'); F.flashScreen(.7, 700, '#fff');
      const cols = ['#ff5a5a', '#ffd84a', '#6dff8a', '#7fc8ff', '#d9b3ff', '#ff8fc0'];
      for (let i = 0; i < 5; i++) setTimeout(() => { const r = box.getBoundingClientRect(); const fake = { getBoundingClientRect: () => ({ left: r.left + rnd() * r.width - 20, top: r.top - 40 + rnd() * 80, width: 40, height: 40 }) }; F.burst(fake, { n: 40, c: cols, sp: 240, shape: 'star', s: 3.5, g: 160, life: 1.2 }); noise(.3, { type: 'highpass', freq: 3000, vol: .2 }); tone(mf(84 + i * 2), .2, { type: 'triangle', vol: .1 }); }, i * 220);
      F.kick(10);
    }
  };

  // ---------- 宝箱:フタが開く ----------
  window.mkChest = function (scale) {
    const rows = SPR.box, lidRows = rows.map((r, i) => i <= 5 ? r : '................'), bodyRows = rows.map((r, i) => i > 5 ? r : '................');
    const d = document.createElement('div'); d.className = 'chest'; d.style.width = d.style.height = (16 * scale) + 'px';
    const beam = document.createElement('div'); beam.className = 'beam';
    const body = mkCv(bodyRows, PAL.box, scale), lid = mkCv(lidRows, PAL.box, scale); lid.classList.add('lid');
    d.append(beam, body, lid); return d;
  };
  window.openLid = async function (card, rare) {
    const c = card.querySelector('.chest'); if (!c) return;
    if (rare) c.classList.add('rainbow');
    c.classList.add('open'); noise(.2, { type: 'bandpass', freq: 800, vol: .25 }); tone(mf(rare ? 88 : 79), .3, { type: 'triangle', vol: .12 });
    F.burst(c, { n: rare ? 30 : 16, c: rare ? ['#ff5a5a', '#ffd84a', '#6dff8a', '#7fc8ff', '#d9b3ff'] : ['#fff6b0', '#ffd84a'], sp: 120, g: -120, shape: 'star', life: .9 });
    await sleep2(520);
  };

  // ---------- 画面ごとのBGM ----------
  const _t2 = title; title = function (...a) { const r = _t2.apply(this, a); music('field'); return r; };
  const _dv = deckView; deckView = function (...a) { const r = _dv.apply(this, a); music('field'); return r; };
  music('field');
})();
</script>
