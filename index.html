<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>疾風ターフ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Dela+Gothic+One&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body,#app,#app *{touch-action:manipulation}
input{touch-action:auto}
html,body{height:100%;background:#0a1410;color:#f2f6ee;font-family:'Zen Maru Gothic',sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
button{font-family:inherit;color:inherit;border:none;background:none;cursor:pointer}
#app{position:fixed;inset:0;max-width:520px;margin:0 auto;overflow:hidden;background:#0f1d16}
.scr{position:absolute;inset:0;display:none;flex-direction:column}
.scr.on{display:flex}
.dela{font-family:'Dela Gothic One'}
/* タイトル */
#title{align-items:center;justify-content:flex-end;padding-bottom:9vh}
#tcv{position:absolute;inset:0;width:100%;height:100%}
.logo{position:absolute;top:9vh;left:0;right:0;text-align:center}
.logo h1{font-family:'Dela Gothic One';font-size:clamp(46px,14vw,70px);line-height:1.05;color:#fff;letter-spacing:.04em;text-shadow:0 5px 0 #0b3d1c,0 0 30px rgba(255,220,120,.6);transform:skewX(-8deg)}
.logo h1 span{color:#ffd54a}
.logo p{margin-top:12px;font-weight:900;font-size:15px;letter-spacing:.3em;text-shadow:0 2px 8px #000}
.tmenu{position:relative;display:flex;flex-direction:column;gap:10px;width:260px}
.btn{padding:14px;border-radius:14px;background:linear-gradient(#ffe36a,#f2a51e);color:#3a2400;font-weight:900;font-size:17px;box-shadow:0 5px 0 #8a5200,inset 0 1px 0 rgba(255,255,255,.55)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #8a5200}
.btn.sub{background:linear-gradient(#2d5a40,#1b3b29);color:#eaf7ee;box-shadow:0 5px 0 #0a1d12,inset 0 1px 0 rgba(255,255,255,.15);font-size:14px}
.btn.red{background:linear-gradient(#ff6a5a,#d63a2a);color:#fff;box-shadow:0 5px 0 #7a1a10}
.btn:disabled{filter:grayscale(1) brightness(.6)}
.rec{position:relative;text-align:center;font-size:12px;color:#d8efe0;text-shadow:0 1px 4px #000}
/* 出馬表 */
#card{background:linear-gradient(#173225,#0c1a12)}
.hdr{padding:9px 12px 7px;background:linear-gradient(rgba(6,40,22,.72),rgba(8,30,18,.92)),url(img/day2.webp) center 30%/cover;box-shadow:0 2px 10px rgba(0,0,0,.5);position:relative;z-index:2}
.hdr .r1{display:flex;align-items:center;gap:8px}
.grade{font-family:'Dela Gothic One';font-size:12px;padding:2px 8px;border-radius:6px;background:#ffd54a;color:#3a2400}
.grade.g1{background:linear-gradient(90deg,#ffd54a,#fff2a8,#ffd54a);box-shadow:0 0 12px rgba(255,213,74,.7)}
.grade.g3{background:#7ad0ff;color:#04223a}.grade.n{background:#cfe8d8;color:#123}
.rname{font-family:'Dela Gothic One';font-size:19px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.money{font-family:'Dela Gothic One';font-size:15px;color:#ffe08a;white-space:nowrap}
.hdr .r2{display:flex;gap:6px;margin-top:5px;font-size:11px;font-weight:700;color:#bfe0c9;flex-wrap:wrap}
.hdr .r2 span{padding:1px 7px;border-radius:999px;background:rgba(0,0,0,.3)}
.ib{width:30px;height:28px;border-radius:8px;background:rgba(0,0,0,.3);font-weight:900;font-size:12px}
#list{flex:1;overflow-y:auto;padding:6px 6px 4px}
.th{display:grid;grid-template-columns:26px 1fr 30px 30px 54px;gap:4px;font-size:9px;color:#8fb8a0;padding:0 6px 3px;font-weight:700}
.row{display:grid;grid-template-columns:26px 1fr 30px 30px 54px;gap:4px;align-items:center;padding:5px 6px;margin-bottom:4px;border-radius:11px;background:linear-gradient(#f6f1e2,#e8e0c8);color:#2a2014;box-shadow:0 2px 0 #9a8a60;position:relative;transition:transform .1s}
.row:active{transform:scale(.98)}
.row.sel{background:linear-gradient(#fff3b0,#ffd85a);box-shadow:0 0 0 3px #ff8a1a,0 2px 0 #9a6a10}
.row.sel2{box-shadow:0 0 0 3px #3aa0ff,0 2px 0 #1a5aa0}
.num{width:26px;height:30px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-family:'Dela Gothic One';font-size:16px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
.nm b{display:block;font-size:14px;font-weight:900;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm small{display:flex;gap:4px;font-size:9.5px;color:#6a5a40;font-weight:700;margin-top:1px;white-space:nowrap}
.nm small i{font-style:normal;padding:0 4px;border-radius:4px;background:rgba(0,0,0,.08)}
.form{font-size:10px;font-weight:900;letter-spacing:.02em;text-align:center;line-height:1.1;color:#5a4a30}
.form .w{color:#d02a1a}
.mk{text-align:center;font-size:13px;font-weight:900;line-height:1;color:#c0201a}
.mk small{display:block;font-size:8px;color:#8a7a5a;font-weight:700}
.odds{text-align:right;font-family:'Dela Gothic One';font-size:15px;color:#1a2a1a}
.odds.fav{color:#d0201a}
.odds small{display:block;font-family:'Zen Maru Gothic';font-size:9px;color:#8a7a5a;font-weight:700}
#betp{background:linear-gradient(#1c3a2a,#0f2318);padding:8px 10px 10px;box-shadow:0 -4px 14px rgba(0,0,0,.5);position:relative;z-index:2}
.tabs{display:flex;gap:4px;margin-bottom:6px}
.tabs button{flex:1;padding:7px 0;border-radius:9px;background:#0b1d13;font-weight:900;font-size:13px;color:#a9cdb6}
.tabs button.on{background:#ffd54a;color:#3a2400}
.tabs button small{display:block;font-size:8.5px;font-weight:700;opacity:.8}
.bsel{display:flex;align-items:center;gap:6px;font-size:12px;min-height:26px}
.bsel .pick{flex:1;font-weight:900}
.bsel .po{font-family:'Dela Gothic One';color:#ffe08a;font-size:14px}
.amt{display:flex;align-items:center;gap:5px;margin:5px 0}
.amt button{padding:6px 9px;border-radius:9px;background:#0b1d13;font-weight:900;font-size:12px}
.amt .v{flex:1;text-align:center;font-family:'Dela Gothic One';font-size:18px;background:#05110a;border-radius:9px;padding:3px}
.tix{display:flex;gap:4px;overflow-x:auto;min-height:0;padding:2px 0 6px}
.tk{flex:none;font-size:10.5px;font-weight:900;padding:4px 8px;border-radius:8px;background:#f6f1e2;color:#2a2014;position:relative;border-left:4px solid #d0201a;white-space:nowrap}
.tk small{display:block;font-size:9px;color:#7a6a4a}
.tk .x{margin-left:5px;color:#a02010}
.brow{display:flex;gap:6px}
/* パドック */
.sheet{position:absolute;inset:0;z-index:20;background:rgba(2,8,4,.8);backdrop-filter:blur(4px);display:none;flex-direction:column;justify-content:flex-end}
.sheet.on{display:flex}
.sin{max-height:90%;overflow-y:auto;background:linear-gradient(#1f3d2c,#0f2318);border-radius:22px 22px 0 0;padding:14px 12px 16px;animation:up .35s cubic-bezier(.2,1.2,.3,1)}
@keyframes up{from{transform:translateY(60px);opacity:0}}
.sin h2{font-family:'Dela Gothic One';font-size:20px;margin-bottom:4px}
.sin .lead{font-size:11px;color:#bfe0c9;margin-bottom:8px;line-height:1.6}
.pd{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pc{background:linear-gradient(#5a8a4a,#3e6a32);border-radius:12px;overflow:hidden;position:relative}
.pc canvas{width:100%;height:96px;display:block}
.pc .lb{position:absolute;left:5px;top:5px;display:flex;gap:4px;align-items:center;font-size:11px;font-weight:900;text-shadow:0 1px 3px #000}
.pc .lb .num{width:20px;height:22px;font-size:12px}
.pc .cm{position:absolute;left:0;right:0;bottom:0;font-size:10px;font-weight:900;padding:3px 6px;background:rgba(0,0,0,.55);min-height:18px}
.inp{width:100%;padding:11px 12px;border-radius:12px;border:none;background:#06140c;color:#fff;font-family:inherit;font-weight:900;font-size:16px;margin:4px 0 8px;box-shadow:inset 0 0 0 2px #2c4a36}
.lbl{font-size:11px;font-weight:900;color:#9fc6ac}
.err{color:#ff8a7a;font-size:12px;font-weight:900;min-height:16px;margin-top:6px;white-space:pre-line}
#lobby{background:linear-gradient(rgba(6,16,10,.7),rgba(6,14,9,.96) 50%),url(img/day1.webp) center top/auto 50% no-repeat,#08130c;align-items:center;padding:6vh 14px 16px;overflow-y:auto}
.code{font-family:'Dela Gothic One';font-size:54px;letter-spacing:.2em;color:#ffe08a;text-shadow:0 0 24px rgba(255,210,80,.5);margin:4px 0}
.mem{width:100%;display:flex;flex-direction:column;gap:6px;margin:12px 0}
.mb{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:12px;background:#0d1f14;box-shadow:inset 0 0 0 1px #2c4a36;font-weight:900}
.mb .dot{width:14px;height:14px;border-radius:50%}
.mb .tag{margin-left:auto;font-size:10px;padding:2px 8px;border-radius:999px;background:#ffd54a;color:#3a2400}
.mb .mo{margin-left:auto;font-family:'Dela Gothic One';color:#ffe08a;font-size:14px}
.seg{display:flex;gap:6px;width:100%}.seg button{flex:1;padding:9px;border-radius:10px;background:#0d1f14;font-weight:900}.seg button.on{background:#ffd54a;color:#3a2400}
#onbar{display:none;align-items:center;gap:5px;padding:5px 10px;background:#06140c;font-size:11px;font-weight:900;overflow-x:auto;white-space:nowrap}
#onbar .tm{font-family:'Dela Gothic One';font-size:15px;color:#ffe08a;margin-right:4px}
#onbar .pl{display:flex;align-items:center;gap:3px;padding:2px 8px;border-radius:999px;background:#13291b}
#onbar .pl.ok{background:#1e5a30}
.help{font-size:13px;line-height:1.8;color:#e4f2e8}.help b{color:#ffd54a}
/* レース */
#race{background:#000}
#rcv{position:absolute;inset:0;width:100%;height:100%}
#rtop{position:absolute;left:0;right:0;top:0;padding:8px 10px;pointer-events:none}
#rtop .r1{display:flex;align-items:center;gap:8px;text-shadow:0 2px 4px #000}
#rtop .rn{font-family:'Dela Gothic One';font-size:15px;flex:1}
#rtop .rem{font-family:'Dela Gothic One';font-size:20px;color:#ffe08a}
#strip{position:relative;height:30px;margin-top:6px;border-radius:8px;background:rgba(0,0,0,.45);overflow:hidden}
#strip i{position:absolute;top:5px;width:20px;height:20px;border-radius:5px;font-style:normal;font-family:'Dela Gothic One';font-size:11px;display:flex;align-items:center;justify-content:center;transform:translateX(-50%);box-shadow:0 1px 3px rgba(0,0,0,.6);transition:left .2s linear}
#strip i.me{box-shadow:0 0 0 2px #ff8a1a,0 0 10px #ffb84a;z-index:2}
#myt{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.mt{display:flex;align-items:center;gap:5px;padding:4px 9px 4px 5px;border-radius:10px;background:rgba(0,0,0,.66);box-shadow:inset 0 0 0 2px #ff8a1a;font-weight:900;font-size:12px;text-shadow:0 1px 2px #000;transition:box-shadow .2s,background .2s}
.mt .tp{font-size:10px;color:#ffcf9a}
.mt .nb{display:inline-flex;width:22px;height:22px;border-radius:5px;align-items:center;justify-content:center;font-family:'Dela Gothic One';font-size:13px;text-shadow:none;box-shadow:0 0 0 1px rgba(0,0,0,.4)}
.mt .rk{font-family:'Dela Gothic One';font-size:13px;color:#fff}
.mt .st{font-size:10px;padding:1px 6px;border-radius:999px;background:#444;color:#ccc}
.mt.hit{background:rgba(10,70,30,.85);box-shadow:inset 0 0 0 2px #4aff8a,0 0 14px rgba(74,255,138,.6)}
.mt.hit .st{background:#2ac05a;color:#fff}
#comm{position:absolute;left:8px;right:8px;bottom:84px;pointer-events:none}
#comm .bx{background:linear-gradient(90deg,rgba(0,0,0,.82),rgba(0,0,0,.6));border-left:5px solid #ffd54a;border-radius:10px;padding:8px 12px;font-weight:900;font-size:16px;line-height:1.45;text-shadow:0 1px 2px #000;min-height:52px;transition:transform .15s}
#comm .bx.hot{border-color:#ff4a3a;font-size:19px;transform:scale(1.03)}
#comm .who{font-size:10px;color:#ffd54a;letter-spacing:.2em}
#cheer{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);width:76%;padding:14px;border-radius:999px;font-family:'Dela Gothic One';font-size:20px;background:linear-gradient(#ff7a5a,#e0301a);color:#fff;box-shadow:0 6px 0 #7a1a0a,0 0 22px rgba(255,90,60,.6);display:none;letter-spacing:.1em}
#cheer:active{transform:translateX(-50%) translateY(4px);box-shadow:0 2px 0 #7a1a0a}
#skip{position:absolute;right:10px;bottom:24px;font-size:11px;font-weight:900;padding:6px 10px;border-radius:999px;background:rgba(0,0,0,.5);display:none}
#photo{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;pointer-events:none}
#photo.on{display:flex}
#photo b{font-family:'Dela Gothic One';font-size:40px;letter-spacing:.2em;color:#fff;text-shadow:0 0 20px #000,0 4px 0 #000;animation:blink 1s steps(2) infinite}
#photo small{font-weight:900;font-size:14px;margin-top:6px;text-shadow:0 2px 6px #000}
@keyframes blink{50%{opacity:.35}}
#gatebg{position:absolute;inset:0;pointer-events:none}
#bigtxt{position:absolute;left:0;right:0;top:34%;text-align:center;pointer-events:none;font-family:'Dela Gothic One';font-size:44px;color:#fff;text-shadow:0 4px 0 #000,0 0 30px rgba(255,200,80,.9);opacity:0}
#bigtxt.on{animation:big 1.4s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes big{0%{opacity:0;transform:scale(2.4)}15%{opacity:1;transform:scale(1)}75%{opacity:1}100%{opacity:0;transform:scale(1.1)}}
/* 演出:紹介カード・覚醒・勝ち馬 */
#intro{position:absolute;left:0;right:0;top:30%;pointer-events:none;display:none;text-align:center}
#intro.on{display:block}
#intro .band{position:relative;margin:0 -10%;padding:16px 10% 14px;background:linear-gradient(90deg,transparent,rgba(0,0,0,.85) 15%,rgba(0,0,0,.85) 85%,transparent);animation:iband 3.6s cubic-bezier(.2,.9,.2,1) forwards}
#intro .band.g1{background:linear-gradient(90deg,transparent,rgba(60,30,0,.9) 15%,rgba(60,30,0,.9) 85%,transparent);box-shadow:0 0 0 2px rgba(255,213,74,.5)}
#intro .no{font-family:'Dela Gothic One';font-size:13px;color:#ffd54a;letter-spacing:.3em}
#intro .nm{font-family:'Dela Gothic One';font-size:34px;line-height:1.15;color:#fff;text-shadow:0 0 20px rgba(255,210,100,.6);margin:2px 0}
#intro .g1 .nm{background:linear-gradient(#fff6c8,#ffc23a);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 #4a2a00)}
#intro .sub{font-size:12px;font-weight:900;color:#d8efe0}
@keyframes iband{0%{transform:scaleY(0);opacity:0}8%{transform:scaleY(1);opacity:1}85%{opacity:1;transform:none}100%{opacity:0;transform:translateX(-30px)}}
#cutin{position:absolute;inset:0;pointer-events:none;display:none;overflow:hidden;z-index:5}
#cutin.on{display:block}
#cutin .sl{position:absolute;left:-20%;right:-20%;top:38%;height:110px;transform:skewY(-8deg);background:linear-gradient(90deg,#120030,#3a0a8a 30%,#0a5aff 60%,#00e0ff);box-shadow:0 0 30px #4af,inset 0 0 40px rgba(255,255,255,.4);animation:cutsl 1.5s cubic-bezier(.2,.9,.2,1) forwards}
#cutin .sl:before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.18) 0 2px,transparent 2px 26px);animation:cutln .3s linear infinite}
@keyframes cutln{to{background-position:28px 0}}
@keyframes cutsl{0%{transform:skewY(-8deg) translateX(100%)}18%{transform:skewY(-8deg) translateX(0)}80%{transform:skewY(-8deg) translateX(0);opacity:1}100%{transform:skewY(-8deg) translateX(-100%);opacity:0}}
#cutin .tx{position:absolute;left:0;right:0;top:calc(38% + 10px);text-align:center;transform:skewY(-8deg);animation:cuttx 1.5s cubic-bezier(.2,1.4,.3,1) forwards}
#cutin .tx b{display:block;font-family:'Dela Gothic One';font-size:46px;color:#fff;letter-spacing:.08em;text-shadow:0 0 18px #6cf,0 4px 0 #102}
#cutin .tx small{display:inline-flex;align-items:center;gap:6px;font-weight:900;font-size:15px;color:#fff;text-shadow:0 2px 4px #000}
@keyframes cuttx{0%{opacity:0;transform:skewY(-8deg) scale(2.2)}20%{opacity:1;transform:skewY(-8deg) scale(1)}80%{opacity:1}100%{opacity:0;transform:skewY(-8deg) scale(.95)}}
#winc{position:absolute;inset:0;z-index:8;display:none;background:radial-gradient(ellipse at 50% 45%,rgba(60,40,0,.55),rgba(0,0,0,.92) 70%);flex-direction:column;align-items:center;justify-content:center}
#winc.on{display:flex;animation:fadein .3s}
@keyframes fadein{from{opacity:0}}
#winc canvas{width:100%;height:46%}
#winc .w1{font-family:'Dela Gothic One';font-size:20px;color:#ffd54a;letter-spacing:.4em;animation:pop .5s .1s both}
#winc .w2{font-family:'Dela Gothic One';font-size:34px;color:#fff;text-shadow:0 0 24px rgba(255,210,80,.8);margin:4px 0;animation:pop .6s .25s both;text-align:center;line-height:1.2}
#winc .w3{font-weight:900;font-size:14px;color:#ffe9b0;animation:pop .6s .45s both}
#winc .w4{margin-top:10px;font-family:'Dela Gothic One';font-size:22px;padding:4px 16px;border-radius:10px;animation:stamp .5s .9s both}
@keyframes pop{from{opacity:0;transform:scale(1.6)}}
@keyframes stamp{0%{opacity:0;transform:scale(3) rotate(-18deg)}70%{opacity:1;transform:scale(.92) rotate(-8deg)}100%{opacity:1;transform:scale(1) rotate(-8deg)}}
.hanko{position:absolute;right:-6px;top:-10px;font-family:'Dela Gothic One';font-size:12px;color:#d0201a;border:2.5px solid #d0201a;border-radius:50%;width:38px;height:38px;display:flex;align-items:center;justify-content:center;background:rgba(255,250,235,.85);transform:rotate(-14deg);animation:stamp .45s both}
/* 結果 */
#result{background:linear-gradient(rgba(6,16,10,.78),rgba(6,14,9,.96) 45%),url(img/g1b.webp) center top/auto 46% no-repeat,#08130c;overflow-y:auto;align-items:center;padding:4vh 12px 20px}
.board{width:100%;background:#0a120d;border-radius:14px;padding:10px;box-shadow:inset 0 0 0 2px #2c4a36,0 8px 24px rgba(0,0,0,.6)}
.board h3{display:flex;justify-content:space-between;font-family:'Dela Gothic One';font-size:15px;color:#ffd54a;margin-bottom:6px}
.board h3 .kk{font-size:13px;padding:1px 10px;border-radius:6px;background:#d02a1a;color:#fff;animation:blink 1s steps(2) 3}
.fr{display:flex;align-items:center;gap:8px;padding:5px 2px;border-bottom:1px dashed #23392b;opacity:0;animation:fin .4s forwards}
@keyframes fin{from{opacity:0;transform:translateX(-14px)}to{opacity:1}}
.fr .pos{font-family:'Dela Gothic One';font-size:20px;width:30px;color:#ffe08a;text-align:center}
.fr .nm2{flex:1;font-weight:900;font-size:14px}
.fr .mg{font-size:11px;color:#9fc6ac;font-weight:700}
.pay{width:100%;margin-top:10px;background:#0a120d;border-radius:14px;padding:10px;box-shadow:inset 0 0 0 2px #2c4a36}
.pay table{width:100%;font-size:12px;border-collapse:collapse}
.pay td{padding:4px 2px;border-bottom:1px solid #1b2c21}
.pay td:last-child{text-align:right;font-family:'Dela Gothic One';color:#ffe08a}
.mine{width:100%;margin-top:10px;text-align:center}
.mine .big{font-family:'Dela Gothic One';font-size:38px;line-height:1.1}
.mine .big.win{color:#ffe08a;text-shadow:0 0 24px rgba(255,210,80,.8)}
.mine .big.lose{color:#9aa}
.mine .sm{font-size:12px;color:#bfe0c9;margin-top:2px}
.tkr{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin-top:8px}
.tkr .tk.hit{border-left-color:#2ac05a;background:#fff8c8;animation:hit 1s ease 2}
.tkr .tk.miss{opacity:.45}
@keyframes hit{50%{transform:scale(1.08)}}
#fxc{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}
#toast{position:absolute;left:50%;top:12%;transform:translateX(-50%);z-index:40;pointer-events:none;opacity:0;background:#fff8d8;color:#3a2600;padding:9px 16px;border-radius:14px;font-weight:900;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.5);white-space:nowrap}
#toast.on{animation:toast 2.2s ease forwards}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-14px)}12%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
#err{position:fixed;left:0;right:0;bottom:0;z-index:99;background:#c0262d;color:#fff;font-size:12px;padding:6px;display:none;white-space:pre-wrap}

<script>
/* ===== レースシミュレーション(描画と分離) ===== */
const P={e:[.16,.07,-.06,-.15],sw:2.4,rb:.04,cb:.01,kr:.07,kc:.03,luck:.08,mud:.06,dist:.06,ou:.2};
function mkRng(seed){let s=seed>>>0||1;return()=>{s^=s<<13;s>>>=0;s^=s>>17;s^=s<<5;s>>>=0;return s/4294967296}}
// 端末ごとの誤差が出ないよう、レース中は四則演算とsqrtだけで乱数を作る
function gU(r){return(r()+r()+r()+r()-2)*1.7320508}
function gN(r){return Math.sqrt(-2*Math.log(r()+1e-9))*Math.cos(2*Math.PI*r())}
// horses: [{rating,style(0逃1先2差3追),pref,mud,cond}] race:{D,going(0良1稍2重)}
// useCond=false なら調子を無視(世間の見立て=オッズ用)
function simRace(horses,race,seed,useCond,record){
  const r=mkRng(seed),n=horses.length,D=race.D,dt=.1;
  const nFront=horses.filter(h=>h.style<=1).length,pace=(nFront-2.5)*.07;
  const st=horses.map((h,i)=>{const late=r()<.03;return{x:0,v:0,lane:i*.9,delay:(late?1.2:0)+r()*.35,luck:gU(r)*P.luck,ou:0,blk:0,fin:null,i,late}});
  // 覚醒:たまに1頭が終盤で急に伸びる(好調な馬ほど起きやすい)
  let awkI=-1,awkF=0;if(r()<.32){const w=horses.map(h=>1+(useCond?Math.max(0,h.cond)*.9:0));let tw=0;for(const x of w)tw+=x;let q=r()*tw;for(let k=0;k<n;k++){q-=w[k];if(q<=0){awkI=k;break}}if(awkI<0)awkI=n-1;awkF=.76+r()*.12}
  const frames=[];let t=0,done=0,after=0;
  while(t<400){t+=dt;
    const order=st.map(s=>s.x).sort((a,b)=>b-a);
    for(let k=0;k<n;k++){const h=horses[k],s=st[k];if(t<s.delay){continue}
      const f=s.x/D;let v=16.6+P.rb*h.rating+(useCond?P.cb*h.cond:0)+s.luck-race.going*.35+(race.going?h.mud*P.mud*race.going:0);
      const e=P.e[h.style];
      if(f<.7)v+=e;else if(f>.76){v+=-e*P.sw+(h.style<=1?-pace:pace*.8)+P.kr*h.rating+(useCond?P.kc*h.cond:0)}else v+=lerpS(e,-e*P.sw,(f-.7)/.06);
      const mis=Math.abs(D-h.pref)/400;if(f>.62)v-=P.dist*(mis*Math.sqrt(mis))*Math.min(1,(f-.62)/.25);
      // 包まれ(差し・追込が馬群の中で)
      if(f>.72&&f<.95&&h.style>=2&&s.blk<=0){let near=0;for(const o of st)if(o!==s&&o.x>s.x&&o.x-s.x<4)near++;if(near>=3&&r()<.012)s.blk=1.4}
      if(s.blk>0){v-=.55;s.blk-=dt}
      if(k===awkI&&s.awk==null&&f>=awkF&&s.x<D){let ahead=0;for(const o of st)if(o.x>s.x)ahead++;if(ahead>=2)s.awk=t;else awkI=-1}
      if(s.awk!=null&&s.x<D)v+=Math.min(1,(t-s.awk)/1.2)*.92;
      s.ou+=(-s.ou*.4+gU(r)*.35)*dt*3;v+=s.ou*P.ou;
      if(s.x>=D)v=Math.max(9,s.v-dt*1.6);
      const acc=t-s.delay<3?(t-s.delay)/3:1;const tv=v*acc;s.v+=(tv-s.v)*Math.min(1,dt*2.5);
      const nx=s.x+s.v*dt;if(s.fin==null&&nx>=D){s.fin=t-dt+(D-s.x)/Math.max(.1,s.v);done++}s.x=nx;
      // 進路(見た目用)
      let tl;if(f<.72)tl=Math.min(k*.9,1+h.style*.9+(k%3)*.3);else tl=h.style>=2?n*.55+h.style*.5+(k%2):Math.max(0,s.lane-.3);
      if(f<.04)tl=k*.9;s.lane+=(tl-s.lane)*Math.min(1,dt*.5)}
    if(record&&Math.round(t*10)%2===0)frames.push({t,x:st.map(s=>s.x),l:st.map(s=>s.lane)});
    if(done===n){after+=dt;if(!record||after>4)break}}
  const res=st.map(s=>({i:s.i,fin:s.fin,late:s.late,awk:s.awk})).sort((a,b)=>a.fin-b.fin);
  return{res,frames}}
function lerpS(a,b,t){return a+(b-a)*Math.max(0,Math.min(1,t))}
if(typeof module!=='undefined')module.exports={simRace,mkRng,gN,P};

</script>
<script>
(function(){
'use strict';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],rnd=Math.random,clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t;
// ダブルタップ・ピンチでの拡大を防ぐ(iPhoneは user-scalable=no を無視するため)
document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});
document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});
{let lastT=0;document.addEventListener('touchend',e=>{const now=Date.now();if(now-lastT<350&&!/INPUT|TEXTAREA/.test(e.target.tagName)){e.preventDefault();const b=e.target.closest&&e.target.closest('button,.row,.card');if(b&&b.id!=='cheer')b.click()}lastT=now},{passive:false})}
document.addEventListener('touchmove',e=>{if(e.touches&&e.touches.length>1)e.preventDefault()},{passive:false});
window.addEventListener('error',e=>{const el=$('#err');el.style.display='block';el.textContent='エラー: '+(e.message||e)});
const LS={get(k,d){try{const v=localStorage.getItem('turf_'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('turf_'+k,JSON.stringify(v))}catch(e){}}};
const gauss=()=>gN(rnd);
const fmt=n=>Math.round(n).toLocaleString('ja-JP');

/* ================= データ ================= */
const FRAME=[['#ffffff','#222'],['#222','#fff'],['#e8322a','#fff'],['#2a62e0','#fff'],['#ffd21a','#222'],['#20a050','#fff'],['#ff8a1a','#222'],['#ff8ab8','#222']];
const STY=['逃げ','先行','差し','追込'];
const COATS=[{n:'鹿毛',b:'#7a4526',m:'#1a120c',l:'#2a1a10'},{n:'栗毛',b:'#a85a26',m:'#c88a4a',l:'#a85a26'},{n:'黒鹿毛',b:'#4a2a1a',m:'#120a06',l:'#1a0f08'},{n:'青毛',b:'#1e1a1c',m:'#0a0808',l:'#0a0808'},{n:'芦毛',b:'#b4b2ae',m:'#e6e4e0',l:'#6a6866'},{n:'栃栗毛',b:'#8a4a1e',m:'#e8c890',l:'#8a4a1e'}];
const SILK=['#e8322a','#2a62e0','#ffd21a','#20a050','#ff8a1a','#9a3ae0','#ffffff','#1a1a1a','#ff8ab8','#3ad0e0','#8a1a2a','#1a3a8a'];
const N1=['ソラ','カゼ','ホシ','ヨゾラ','アカツキ','ハヤテ','イナズマ','ツバメ','コハク','ミナモ','シズク','ホムラ','カグラ','ユキミ','ルリ','ヒスイ','トキ','アサヒ','ナギ','ミカヅキ','サザナミ','クレナイ','ハルカ','シノノメ','タマユラ','オボロ','カスミ','ヒバリ','イブキ','ムサシ'];
const N2=['ノツバサ','ブレイブ','ダンサー','ランナー','キング','クイーン','ボルト','ハート','スター','ロード','ウイング','ドリーム','ミラクル','フラッシュ','サンバ','マーチ','エース','ソング','ブルーム','ストーム','グローリー','ファイア','ジェット','ラプソディ','オーラ','バロン','レディ','ゼファー'];
const GOING=['良','稍重','重'];
const RACES=[{n:'若葉ステークス',g:'OP'},{n:'春風特別',g:'1勝'},{n:'みなと賞',g:'2勝'},{n:'さざなみ特別',g:'1勝'},{n:'紅葉ステークス',g:'OP'},{n:'銀河賞',g:'G3'},{n:'夜明け特別',g:'2勝'},{n:'流星ステークス',g:'OP'},{n:'あかね賞',g:'G3'},{n:'疾風カップ',g:'G2'}];
const G1=['グランドターフ','天翔記念','ゴールデンゲート賞'];

/* ================= 画像 ================= */
const IMG={};['day1','day2','g1a','g1b','g1c','paddock','title'].forEach(k=>{const i=new Image();i.decoding='async';i.src='img/'+k+'.webp';IMG[k]=i});
const ok=k=>IMG[k]&&IMG[k].complete&&IMG[k].naturalWidth>0;
/* ================= 状態 ================= */
let S={money:LS.get('money',10000),no:LS.get('no',1),best:LS.get('best',10000),hits:LS.get('hits',0),maxPay:LS.get('maxPay',0)};
let R=null,betType='win',sel=[],amt=100,tickets=[];
function save(){if(ON.on)return;LS.set('money',S.money);LS.set('no',S.no);LS.set('best',S.best);LS.set('hits',S.hits);LS.set('maxPay',S.maxPay)}

function makeRace(forceG1){const no=S.no;const isG1=forceG1!=null?forceG1:no%6===0;const base=isG1?{n:G1[Math.floor(no/6-1)%G1.length],g:'G1'}:RACES[(no-1)%RACES.length];
  const n=isG1?10:8;const D=[1200,1600,2000,2400,1800,1400][Math.floor(rnd()*6)]+(isG1?400:0);const going=rnd()<.62?0:rnd()<.6?1:2;
  const used=new Set();const hs=[];
  for(let i=0;i<n;i++){let nm;do{nm=N1[Math.floor(rnd()*N1.length)]+N2[Math.floor(rnd()*N2.length)]}while(used.has(nm)||nm.length>9);used.add(nm);
    const rating=gauss()+(isG1?.2:0),style=Math.floor(rnd()*4),pref=1200+Math.floor(rnd()*9)*200,mud=rnd()<.25?1:rnd()<.3?-1:0;
    const cond=[-2,-1,-1,0,0,0,0,1,1,2][Math.floor(rnd()*10)];
    const form=[0,1,2].map(()=>clamp(Math.round(4.5-rating*2.2+gauss()*2.3),1,14));
    const coat=COATS[Math.floor(rnd()*COATS.length)];const s1=SILK[Math.floor(rnd()*SILK.length)];let s2;do{s2=SILK[Math.floor(rnd()*SILK.length)]}while(s2===s1);
    hs.push({i,num:i+1,nm,rating,style,pref,mud,cond,form,coat,silk:[s1,s2,Math.floor(rnd()*4)],frame:FRAME[n>8?Math.min(7,Math.floor(i*8/n)):i],weight:450+Math.floor(rnd()*70)})}
  R={no,name:base.n,g:base.g,isG1,n,D,going,hs,seed:Math.floor(rnd()*1e9),bg:isG1?['g1a','g1b','g1c'][Math.floor(rnd()*3)]:['day1','day2'][Math.floor(rnd()*2)]};
  // 世間の見立て(調子は分からない)で何百回も走らせてオッズを作る
  const W=new Array(n).fill(0),T3=new Array(n).fill(0),Q={};const M=isG1?160:200;
  for(let j=0;j<M;j++){const r=simRace(hs,R,R.seed*7+j*131,false,false).res;W[r[0].i]++;for(let k=0;k<Math.min(3,n);k++)T3[r[k].i]++;const a=Math.min(r[0].i,r[1].i),b=Math.max(r[0].i,r[1].i);Q[a+'-'+b]=(Q[a+'-'+b]||0)+1}
  const mo=p=>Math.max(1.1,Math.round(.8/Math.max(p,.004)*10)/10);
  hs.forEach(h=>{const p=(W[h.i]+.5)/(M+n*.5);h.odds=Math.min(299.9,mo(p*(.9+rnd()*.2)));const p3=(T3[h.i]+.5)/(M+1);h.plc=Math.max(1.0,Math.round(.8/p3*10)/10);h.plcMax=Math.round(h.plc*(1.3+rnd()*.3)*10)/10});
  R.q=Q;R.M=M;
  const ord=[...hs].sort((a,b)=>a.odds-b.odds);ord.forEach((h,k)=>h.pop=k+1);
  // 予想家の印
  const mark=['◎','○','▲','△','△'];
  const pa=[...hs].sort((a,b)=>(b.rating+gauss()*.35)-(a.rating+gauss()*.35));pa.forEach((h,k)=>h.m1=mark[k]||'');
  const pb=[...hs].sort((a,b)=>(b.cond*.7+b.rating*.5+gauss()*.6)-(a.cond*.7+a.rating*.5+gauss()*.6));pb.forEach((h,k)=>h.m2=mark[k]||'');
  // パドックの一言
  hs.forEach(h=>{const c=h.cond;const tr=rnd()<.7;const v=tr?c:Math.floor(rnd()*5)-2;
    h.pdc=v>=2?'気配抜群!踏み込み力強い':v===1?'毛ヅヤがいいですね':v===0?['落ち着いて歩けています','平常どおり','可もなく不可もなく'][Math.floor(rnd()*3)]:v===-1?'少しうるさい仕草':'イレ込んで汗びっしょり…';
    h.pdTell=c})}
function quiOdds(a,b){const k=Math.min(a,b)+'-'+Math.max(a,b);const p=((R.q[k]||0)+.3)/(R.M+3);return Math.min(999.9,Math.max(1.5,Math.round(.75/p*10)/10))}

/* ================= 出馬表 ================= */
function showCard(){scr('card');sel=[];tickets=[];amt=Math.min(100,S.money)||100;
  $('#cGrade').textContent=R.g;$('#cGrade').className='grade '+(R.g==='G1'?'g1':R.g.startsWith('G')?'g3':R.g==='OP'?'':'n');
  $('#cName').textContent=R.name;updMoney();
  $('#cInfo').innerHTML=`<span>第${R.no}レース</span><span>芝 ${R.D}m</span><span>馬場:${GOING[R.going]}</span><span>${R.n}頭</span>`;
  renderList();renderBet();Sound.ambience('paddock');ON.cardUI();if(R.isG1)setTimeout(()=>toast('🏆 今日のメインはG1!'),400)}
function updMoney(){$('#cMoney').textContent='💰'+fmt(S.money - tickets.reduce((a,t)=>a+t.amt,0))}
function renderList(){const L=$('#list');L.innerHTML=`<div class="th"><span>馬番</span><span>馬名 / 脚質・距離・馬場</span><span style="text-align:center">前走</span><span style="text-align:center">印</span><span style="text-align:right">単勝</span></div>`;
  R.hs.forEach(h=>{const d=document.createElement('div');d.className='row'+(sel[0]===h.i?' sel':'')+(sel[1]===h.i?' sel2':'');
    const dist=h.pref<=1400?'短距離':h.pref<=1800?'マイル':h.pref<=2200?'中距離':'長距離';const mud=h.mud>0?'道悪◎':h.mud<0?'道悪×':'';
    d.innerHTML=`<div class="num" style="background:${h.frame[0]};color:${h.frame[1]}">${h.num}</div><div class="nm"><b>${h.nm}</b><small><i>${STY[h.style]}</i><i>${dist}</i>${mud?`<i>${mud}</i>`:''}</small></div><div class="form">${h.form.map(f=>`<span class="${f===1?'w':''}">${f}</span>`).join('<br>')}</div><div class="mk">${h.m1||'&nbsp;'}<small>本紙</small>${h.m2||'&nbsp;'}<small>パドック</small></div><div class="odds ${h.pop===1?'fav':''}">${h.odds.toFixed(1)}<small>${h.pop}番人気</small></div>`;
    d.onclick=()=>{Sound.tap();pick(h.i)};L.appendChild(d)})}
function pick(i){if(betType==='qui'){if(sel.includes(i))sel=sel.filter(x=>x!==i);else{sel.push(i);if(sel.length>2)sel.shift()}}else sel=sel[0]===i?[]:[i];renderList();renderBet()}
function renderBet(){$$('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.b===betType));
  const h=sel.map(i=>R.hs[i]);let p='馬をタップして選ぶ',o='';
  if(betType==='win'&&h[0]){p=`${h[0].num} ${h[0].nm}`;o=h[0].odds.toFixed(1)+'倍'}
  if(betType==='plc'&&h[0]){p=`${h[0].num} ${h[0].nm}`;o=h[0].plc.toFixed(1)+'〜'+h[0].plcMax.toFixed(1)+'倍'}
  if(betType==='qui'){if(h.length===2){p=`${h[0].num} - ${h[1].num}`;o=quiOdds(h[0].i,h[1].i).toFixed(1)+'倍'}else p=h.length?`${h[0].num} - ?(もう1頭)`:'2頭えらぶ(順番は自由)'}
  $('#bPick').textContent=p;$('#bOdds').textContent=o;$('#bAmt').textContent=fmt(amt);
  $('#tix').innerHTML=tickets.length?tickets.map((t,k)=>`<div class="tk">${t.label}<small>${fmt(t.amt)}円</small><span class="x" data-k="${k}">✕</span></div>`).join(''):'<span style="font-size:11px;color:#8fb8a0">まだ馬券を買っていません(買わずに見るだけもOK)</span>';
  $$('#tix .x').forEach(x=>x.onclick=e=>{e.stopPropagation();tickets.splice(+x.dataset.k,1);Sound.tap();ON.betsChanged();updMoney();renderBet()});
  updMoney()}
$$('.tabs button').forEach(b=>b.onclick=()=>{Sound.tap();betType=b.dataset.b;if(betType!=='qui')sel=sel.slice(0,1);renderList();renderBet()});
$$('.amt button').forEach(b=>b.onclick=()=>{Sound.tap();const left=S.money-tickets.reduce((a,t)=>a+t.amt,0);const a=b.dataset.a;amt=a==='max'?left:clamp(amt+(+a),100,Math.max(100,left));amt=Math.floor(amt/100)*100||100;renderBet()});
$('#bBuy').onclick=()=>{audio();const left=S.money-tickets.reduce((a,t)=>a+t.amt,0);
  const need=betType==='qui'?2:1;if(sel.length<need){toast(betType==='qui'?'2頭えらんでください':'馬をえらんでください');Sound.no();return}
  if(amt>left||left<100){toast('お金が足りません');Sound.no();return}
  const h=sel.map(i=>R.hs[i]);const nm={win:'単勝',plc:'複勝',qui:'馬連'}[betType];
  tickets.push({type:betType,sel:[...sel],amt,label:nm+' '+h.map(x=>x.num).join('-')});Sound.ticket();ON.betsChanged();
  sel=[];renderList();renderBet()};
$('#bGo').onclick=()=>{audio();Speech.unlock();if(ON.on){ON.toggleReady();return}startRace()};
$('#bPad').onclick=()=>{audio();paddock()};

let padAnim=null;

  $('#oCreate').onclick=async()=>{audio();Speech.unlock();busy(true);try{const code=String(1000+Math.floor(Math.random()*9000));await ON.connect(code,nameOf(),true);closeSheet();ON.total=5;ON.lobbyUI()}catch(e){busy(false);$('#oErr').textContent=e.message||String(e)}};
  $('#oJoin').onclick=async()=>{audio();Speech.unlock();const code=($('#oCode').value||'').replace(/\D/g,'');if(code.length!==4){$('#oErr').textContent='合言葉は4桁の数字です';return}busy(true);
    try{await ON.connect(code,nameOf(),false);closeSheet();ON.lobbyUI();}catch(e){busy(false);$('#oErr').textContent=e.message||String(e)}}}
$('#tOnline').onclick=()=>{audio();Sound.tap();onlineSheet()};

/* ================= タイトル背景 ================= */
const tcv=$('#tcv');let tHorses=null;
function drawTitle(t,dt){const W=tcv.clientWidth,H=tcv.clientHeight;if(tcv.width!==Math.round(W*DPR)){DPR=Math.min(2,devicePixelRatio||1);tcv.width=W*DPR;tcv.height=H*DPR}const c=tcv.getContext('2d');c.setTransform(DPR,0,0,DPR,0,0);
  if(ok('title')){const I=IMG.title,z=1.06+Math.sin(t*.25)*.04,iw=I.naturalWidth,ih=I.naturalHeight,sc=Math.max(W/iw,H/ih)*z;const dw=iw*sc,dh=ih*sc;c.drawImage(I,(W-dw)/2+Math.sin(t*.4)*6,(H-dh)/2,dw,dh)}
  else{const g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,'#f08a4a');g.addColorStop(1,'#1a3a14');c.fillStyle=g;c.fillRect(0,0,W,H)}
  const sh=c.createLinearGradient(0,0,0,H);sh.addColorStop(0,'rgba(0,0,0,.35)');sh.addColorStop(.3,'rgba(0,0,0,0)');sh.addColorStop(.7,'rgba(0,0,0,0)');sh.addColorStop(1,'rgba(0,0,0,.7)');c.fillStyle=sh;c.fillRect(0,0,W,H);
  c.strokeStyle='rgba(255,240,210,.35)';c.lineWidth=1.6;for(let i=0;i<14;i++){const y=H*(.55+((i*53)%40)/100),x=((t*700+i*173)%(W+300))-150;c.beginPath();c.moveTo(W-x,y);c.lineTo(W-x+40+i%3*30,y);c.stroke()}
  for(let i=0;i<20;i++){const a=(t*.3+i*.37)%1;c.fillStyle=`rgba(255,230,170,${.6*(1-a)})`;c.beginPath();c.arc((i*97)%W+Math.sin(t+i)*10,H*(.85-a*.5),1.6,0,7);c.fill()}}

/* ================= ループ ================= */
let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;try{if(cur==='title')drawTitle(now/1000,dt);if(cur==='race')raceTick(dt);drawFx(dt)}catch(e){const el=$('#err');el.style.display='block';el.textContent='エラー: '+e.message+'\n'+(e.stack||'').split('\n').slice(1,3).join('\n')}requestAnimationFrame(loop)}
rsz();toTitle();requestAnimationFrame(loop);
window.__ON=ON;window.__turf={drawHorse,COATS,get R(){return R},get RS(){return RS},get S(){return S},makeRace,showCard,startRace,showResult,buy(type,s,a){tickets.push({type,sel:s,amt:a,label:type+' '+s.join('-')})},set fast(v){if(RS)RS.fast=v}};
})();
